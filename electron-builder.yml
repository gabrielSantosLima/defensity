appId: com.defensity.app
productName: defensity
copyright: Copyright © 2026 Gabriel Santos Lima

directories:
  output: dist
  buildResources: build

files:
  - dist/main/**/*
  - dist/renderer/**/*
  - build/icon.png
  - package.json
  - "!node_modules/**/*"

asar: true

extraResources:
  - from: docker
    to: docker

win:
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: Gabriel Santos Lima
